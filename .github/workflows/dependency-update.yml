name: Update .NET Dependencies

# Updates .NET dependencies (SDK, tools and NuGet packages) and opens a pull request with a report.
# The packages step scans the repository for project and props files; no solution file is required.
# For the PR: check what has changed and use the relevant commit/ PR message.

env:
  PRIVATE_GITHUB_FEED_USER: ${{ github.actor }}
  PRIVATE_GITHUB_FEED_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json
      - name: Get app token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.PULL_REQUEST_APP_ID }}
          private-key: ${{ secrets.PULL_REQUEST_PRIVATE_KEY }}
      - name: Create artifacts/results directory
        run: mkdir -p artifacts/results
      - name: Restore tools
        run: dotnet tool restore
      - name: Bump SDK
        run: |
          dotnet dotbump sdk -o ./artifacts/results/bump-sdk-report.md
      - name: Refresh .NET SDK after update
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json
      - name: Bump Tools
        run: |
          dotnet dotbump tools -o ./artifacts/results/bump-tools-report.md
      - name: Bump NuGet packages
        run: |
          # Exclusions must be existing directories, so only pass this repo's test data when present.
          exclude_args=()
          if [ -d ./test/DotBump.Tests/Data ]; then
            exclude_args+=(--exclude ./test/DotBump.Tests/Data)
          fi

          dotnet dotbump packages \
            --path . \
            --type minor \
            "${exclude_args[@]}" \
            --output ./artifacts/results/bump-packages-report.md
      - name: Check for changes
        id: changes
        run: |
          # Compare against the checked-out ref so only the bump changes are detected.
          git diff --name-only HEAD > changed_files.txt
          echo "packages_changed=false" >> $GITHUB_OUTPUT
          echo "globaljson_changed=false" >> $GITHUB_OUTPUT
          echo "dotnettools_changed=false" >> $GITHUB_OUTPUT

          if grep -qE '\.(csproj|fsproj|vbproj)$|(^|/)Directory\.(Packages|Build)\.(props|targets)$' changed_files.txt; then
            echo "packages_changed=true" >> $GITHUB_OUTPUT
          fi

          if grep -q '^global\.json$' changed_files.txt; then
            echo "globaljson_changed=true" >> $GITHUB_OUTPUT
          fi

          if grep -q 'dotnet-tools\.json$' changed_files.txt; then
            echo "dotnettools_changed=true" >> $GITHUB_OUTPUT
          fi

          if [ -f changed_files.txt ]; then
            rm changed_files.txt
            echo "Cleaned up changed_files.txt"
          fi

      - name: Prepare pull request metadata
        id: pr-meta
        run: |
          packages="${{ steps.changes.outputs.packages_changed }}"
          globaljson="${{ steps.changes.outputs.globaljson_changed }}"
          tools="${{ steps.changes.outputs.dotnettools_changed }}"

          # Default values
          pr_title=""
          pr_commit=""
          pr_summary=""

          # sdk, tools and packages updated
          if [ "$packages" = "true" ] && [ "$globaljson" = "true" ] && [ "$tools" = "true" ]; then
            pr_title="dep: bump .NET SDK, tools and NuGet package versions"
            pr_commit="dep: bump .NET SDK, tools and NuGet package versions"
            pr_summary="Update the .NET SDK, local tools, and NuGet packages."
          elif [ "$packages" = "true" ] && [ "$globaljson" = "true" ]; then
            pr_title="dep: bump .NET SDK and NuGet package versions"
            pr_commit="dep: bump .NET SDK and NuGet package versions"
            pr_summary="Update the .NET SDK and NuGet packages."
          elif [ "$globaljson" = "true" ] && [ "$tools" = "true" ]; then
            pr_title="dep: bump .NET SDK and tools versions"
            pr_commit="dep: bump .NET SDK and tools versions"
            pr_summary="Update the .NET SDK and local tools."
          elif [ "$packages" = "true" ] && [ "$tools" = "true" ]; then
            pr_title="dep: bump .NET tools and NuGet package versions"
            pr_commit="dep: bump .NET tools and NuGet package versions"
            pr_summary="Update the local tools and NuGet packages."
          elif [ "$packages" = "true" ]; then
            pr_title="dep: bump NuGet package versions"
            pr_commit="dep: bump NuGet package versions"
            pr_summary="Update the NuGet packages."
          elif [ "$globaljson" = "true" ]; then
            pr_title="dep: bump .NET SDK version"
            pr_commit="dep: bump .NET SDK version"
            pr_summary="Update the .NET SDK."
          elif [ "$tools" = "true" ]; then
            pr_title="dep: bump .NET tools versions"
            pr_commit="dep: bump .NET tools versions"
            pr_summary="Update the local tools."
          fi

          echo "title=${pr_title}" >> "$GITHUB_OUTPUT"
          echo "commit=${pr_commit}" >> "$GITHUB_OUTPUT"
          echo "summary=${pr_summary}" >> "$GITHUB_OUTPUT"

      - name: Compose pull request body
        run: |
          : > artifacts/results/pr-body.md
          summary="${{ steps.pr-meta.outputs.summary }}"
          if [ -n "$summary" ]; then
            printf '%s\n\n' "$summary" >> artifacts/results/pr-body.md
          fi
          for report in bump-sdk-report bump-tools-report bump-packages-report; do
            file="artifacts/results/${report}.md"
            if [ -f "$file" ]; then
              cat "$file" >> artifacts/results/pr-body.md
            fi
          done

      - name: Create pull request
        if: steps.changes.outputs.packages_changed == 'true' || steps.changes.outputs.globaljson_changed == 'true' || steps.changes.outputs.dotnettools_changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: ${{ steps.pr-meta.outputs.commit }}
          title: ${{ steps.pr-meta.outputs.title }}
          body-path: artifacts/results/pr-body.md
          branch: dependency-update
          delete-branch: 'true'
          assignees: robyvandamme

      - name: 'Save results'
        uses: actions/upload-artifact@v7
        with:
          name: results
          path: artifacts/results
