name: Update .NET Dependencies (Major)

# Updates the .NET SDK, target frameworks, local tools and NuGet packages to their latest major versions
# and opens a pull request. Build and test validation is handled by the compile-and-test workflow triggered by the PR.

env:
  PRIVATE_GITHUB_FEED_USER: ${{ github.actor }}
  PRIVATE_GITHUB_FEED_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  update-major-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json
      - name: Get app token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.WORKFLOW_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}
      - name: Create artifacts/results directory
        run: mkdir -p artifacts/results
      - name: Restore tools
        run: dotnet tool restore
      - name: Bump SDK
        run: |
          dotnet dotbump sdk --type major -o ./artifacts/results/bump-sdk-report.md
      - name: Refresh .NET SDK after update
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json
      - name: Restore tools (updated SDK)
        run: dotnet tool restore
      - name: Bump target frameworks
        run: |
          exclude_args=()
          if [ -d ./test/DotBump.Tests/Data ]; then
            exclude_args+=(--exclude ./test/DotBump.Tests/Data)
          fi
          dotnet dotbump frameworks \
            "${exclude_args[@]}" \
            -o ./artifacts/results/bump-frameworks-report.md
      - name: Bump Tools
        run: |
          dotnet dotbump tools --type major -o ./artifacts/results/bump-tools-report.md
      - name: Restore tools (bumped versions)
        run: dotnet tool restore
      - name: Bump NuGet packages
        run: |
          exclude_args=()
          if [ -d ./test/DotBump.Tests/Data ]; then
            exclude_args+=(--exclude ./test/DotBump.Tests/Data)
          fi
          dotnet dotbump packages \
            --path . \
            --type major \
            "${exclude_args[@]}" \
            --output ./artifacts/results/bump-packages-report.md
      - name: Restore packages (regenerate lock files)
        run: dotnet restore -p:RestoreLockedMode=false
      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Compose pull request body
        run: |
          : > artifacts/results/pr-body.md
          printf '%s\n\n' "Update the .NET SDK and target frameworks, and bump local tools and NuGet packages to their latest major versions." >> artifacts/results/pr-body.md
          for report in bump-sdk-report bump-frameworks-report bump-tools-report bump-packages-report; do
            file="artifacts/results/${report}.md"
            if [ -f "$file" ]; then
              cat "$file" >> artifacts/results/pr-body.md
            fi
          done
      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: 'dep: major dependency update'
          title: 'dep: major dependency update'
          body-path: artifacts/results/pr-body.md
          branch: dependency-update-major
          delete-branch: 'true'
          assignees: robyvandamme
      - name: 'Save results'
        uses: actions/upload-artifact@v7
        with:
          name: results
          path: artifacts/results
