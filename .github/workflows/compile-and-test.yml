name: Compile and Test

env:
  PRIVATE_GITHUB_FEED_USER: ${{ secrets.PRIVATE_NUGET_FEED_USER }}
  PRIVATE_GITHUB_FEED_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - '**'
      - '!README.md'
      - '!doc/**'
      - '!.github/workflows/**'
      - '!GitVersion.yml'
      - '!scripts/**'
      - '!.config/**'
      - '!AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  ubuntu-latest:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./global.json
      - name: 'Cache: .nuke/temp, ~/.nuget/packages'
        uses: actions/cache@v4
        with:
          path: |
            .nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}
      - name: 'Run: Compile'
        run: ./build.cmd Compile
      - name: 'Save test reports'
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: artifacts/test-reports
      - name: Code Coverage Summary Report
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95
        with:
          filename: artifacts/test-reports/*/coverage.cobertura.xml
          badge: true
          output: both
          format: markdown
      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md
