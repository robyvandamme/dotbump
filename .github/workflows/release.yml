name: Release

env:
  PRIVATE_GITHUB_FEED_USER: ${{ github.actor }}
  PRIVATE_GITHUB_FEED_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      publish_to_nuget:
        description: Also publish to nuget.org
        type: boolean
        default: false

permissions:
  packages: write
  contents: read
  id-token: write

jobs:
  ubuntu-latest:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json
      - name: 'Cache: .nuke/temp, ~/.nuget/packages'
        uses: actions/cache@v6
        with:
          path: |
            .nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}
      - name: 'Run: Compile'
        run: ./build.cmd Compile
        env:
          NuGetApiKey: ${{ secrets.GITHUB_TOKEN }}
          NuGetFeed: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          PackAndPublish: true
      - name: 'NuGet login (trusted publishing)'
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_to_nuget
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: 'Publish to nuget.org'
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_to_nuget
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
      - name: 'Save test reports'
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: artifacts/test-reports
      - name: 'Save NuGet packages'
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages
